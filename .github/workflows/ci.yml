name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Virtual display for the Swing GUI tests
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Clean build + all tests (JUnit 5, Maven Surefire) + coverage
        run: xvfb-run -a mvn -B clean verify -Pcoverage
      - name: Package without Maven (build.sh)
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-and-jar
          path: |
            target/surefire-reports/
            target/site/jacoco/
            dist/
